<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>FerriDash</title>
  <style>
    :root { --ink: #f8fafc; --muted: #94a3b8; --brand: #f4600c; --sun: #fcca1c; --card: rgb(255 255 255 / 0.06); --line: rgb(255 255 255 / 0.14); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink);
      background: radial-gradient(120% 70% at 50% 110%, rgb(244 96 12 / 0.45), transparent 60%), linear-gradient(180deg, #070b18, #0f172a 55%, #1b1530);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .wrap { width: 100%; max-width: 420px; }
    .logo { display: block; width: 220px; max-width: 70%; margin: 0 auto 28px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; backdrop-filter: blur(12px); }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
    label { display: block; font-size: 0.85rem; margin: 18px 0 6px; color: #cbd5e1; }
    input { width: 100%; font-size: 1rem; padding: 14px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgb(15 23 42 / 0.75); color: var(--ink); outline: none; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgb(244 96 12 / 0.25); }
    button { width: 100%; margin-top: 16px; font-size: 1rem; font-weight: 600; padding: 14px; border: 0; border-radius: 999px; color: #fff; background: linear-gradient(90deg, #f4600c, #b4410a); }
    button:disabled { opacity: 0.6; }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
    .err { color: #fda4af; margin-top: 12px; font-size: 0.9rem; min-height: 1.2em; }
    .hint { margin-top: 14px; font-size: 0.82rem; }
    .saved { margin-top: 14px; font-size: 0.85rem; color: #cbd5e1; word-break: break-all; }
    .foot { margin-top: 26px; text-align: center; font-size: 0.75rem; color: #64748b; }
    .spinner { width: 34px; height: 34px; border: 3px solid rgb(255 255 255 / 0.15); border-top-color: var(--sun); border-radius: 50%; margin: 10px auto 0; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.svg" alt="FerriDash" />

    <!-- Opening the saved school -->
    <div class="card" id="opening" hidden>
      <h1>Opening your school…</h1>
      <p id="openingUrl"></p>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <!-- First run, or changing school -->
    <form class="card" id="setup" novalidate hidden>
      <h1>Connect to your school</h1>
      <p>Enter the FerriDash address your school gave you. You only do this once.</p>
      <label for="url">School's FerriDash address</label>
      <input id="url" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="e.g. 192.168.0.48:3100 or fees.myschool.co.za" required />
      <div class="err" id="err" role="alert"></div>
      <button id="connect" type="submit">Connect</button>
      <button id="keep" type="button" class="ghost" hidden>Keep the current school</button>
      <p class="saved" id="current" hidden></p>
      <p class="hint">At school, connect your phone to the school Wi-Fi first. Ask the school office for the address if you don't have it.</p>
    </form>

    <p class="foot">Copyright © Infinite Q Graphics</p>
  </div>

  <script>
    // The app is a shell: the school's own FerriDash server provides everything after sign-in.
    const KEY = "ferridash.server";
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const saved = localStorage.getItem(KEY);

    /** "192.168.0.48:3100" -> "http://192.168.0.48:3100"; trailing slashes removed. */
    function normalise(raw) {
      let v = raw.trim().replace(/\s+/g, "");
      if (!v) return null;
      if (!/^https?:\/\//i.test(v)) v = (/^(\d{1,3}\.){3}\d{1,3}(:\d+)?(\/|$)/.test(v) || /^localhost/i.test(v) || /:\d+/.test(v) ? "http://" : "https://") + v;
      try { const u = new URL(v); return u.origin; } catch { return null; }
    }

    /** True when a FerriDash server answers at this address (reads its public web app manifest). */
    async function reachable(origin) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch(origin + "/manifest.webmanifest", { signal: ctrl.signal, cache: "no-store", mode: "no-cors" });
        return res.type === "opaque" || res.ok;
      } catch { return false; } finally { clearTimeout(t); }
    }

    function open(origin) { location.replace(origin + "/login"); }

    function showSetup(message) {
      $("opening").hidden = true;
      $("setup").hidden = false;
      $("err").textContent = message || "";
      if (saved) {
        $("url").value = saved;
        $("current").hidden = false;
        $("current").textContent = "Current school: " + saved;
        $("keep").hidden = false;
      }
    }

    $("keep").addEventListener("click", () => saved && open(saved));
    $("setup").addEventListener("submit", async (e) => {
      e.preventDefault();
      const origin = normalise($("url").value);
      if (!origin) { $("err").textContent = "That doesn't look like a web address. Check it and try again."; return; }
      $("connect").disabled = true; $("connect").textContent = "Connecting…"; $("err").textContent = "";
      const ok = await reachable(origin);
      $("connect").disabled = false; $("connect").textContent = "Connect";
      if (!ok) { $("err").textContent = "FerriDash didn't answer at " + origin + ". Check the address and that you're on the school Wi-Fi."; return; }
      localStorage.setItem(KEY, origin);
      open(origin);
    });

    (async () => {
      // FerriDash's sign-in page links here with ?change=1 to switch school.
      if (!saved || params.has("change")) return showSetup();
      $("opening").hidden = false;
      $("openingUrl").textContent = saved;
      if (await reachable(saved)) open(saved);
      else showSetup("Can't reach your school's FerriDash right now. Check that you're on the school Wi-Fi, or change the address.");
    })();
  </script>
</body>
</html>
