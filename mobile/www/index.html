<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>FerriDash</title>
  <style>
    :root { --ink: #f8fafc; --muted: #94a3b8; --brand: #f4600c; --sun: #fcca1c; --card: rgb(255 255 255 / 0.06); --line: rgb(255 255 255 / 0.14); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink);
      background: radial-gradient(120% 70% at 50% 110%, rgb(244 96 12 / 0.45), transparent 60%), linear-gradient(180deg, #070b18, #0f172a 55%, #1b1530);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .wrap { width: 100%; max-width: 420px; }
    .logo { display: block; width: 220px; max-width: 70%; margin: 0 auto 28px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; backdrop-filter: blur(12px); }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
    button { width: 100%; margin-top: 16px; font-size: 1rem; font-weight: 600; padding: 14px; border: 0; border-radius: 999px; color: #fff; background: linear-gradient(90deg, #f4600c, #b4410a); }
    .foot { margin-top: 26px; text-align: center; font-size: 0.75rem; color: #64748b; }
    .spinner { width: 34px; height: 34px; border: 3px solid rgb(255 255 255 / 0.15); border-top-color: var(--sun); border-radius: 50%; margin: 10px auto 0; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.svg" alt="FerriDash" />

    <div class="card" id="opening">
      <h1>Opening FerriDash…</h1>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <div class="card" id="offline" hidden>
      <h1>No internet connection</h1>
      <p>FerriDash needs the internet. Check your mobile data or Wi-Fi, then try again.</p>
      <button id="retry" type="button">Try again</button>
    </div>

    <p class="foot">Copyright © Infinite Q Graphics</p>
  </div>

  <script>
    // The app is a shell around the live FerriDash: everything after sign-in comes from the website.
    const LIVE = "https://ferridash.autogration.co.za";
    const $ = (id) => document.getElementById(id);

    /** True when FerriDash answers (reads its public web app manifest). */
    async function reachable() {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 10000);
      try {
        const res = await fetch(LIVE + "/manifest.webmanifest", { signal: ctrl.signal, cache: "no-store", mode: "no-cors" });
        return res.type === "opaque" || res.ok;
      } catch { return false; } finally { clearTimeout(t); }
    }

    async function start() {
      $("offline").hidden = true;
      $("opening").hidden = false;
      if (await reachable()) location.replace(LIVE + "/login");
      else { $("opening").hidden = true; $("offline").hidden = false; }
    }

    $("retry").addEventListener("click", start);
    window.addEventListener("online", start);
    start();
  </script>
</body>
</html>
